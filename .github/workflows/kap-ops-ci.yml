name: KAP Studio - backend QA

on:
  push:
    branches:
      - feature/kap-medusa-hybrid
    paths:
      - 'kap-ops/**'
      - '.github/workflows/kap-ops-ci.yml'
  pull_request:
    paths:
      - 'kap-ops/**'
      - '.github/workflows/kap-ops-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kap-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kap-ops
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kap-ops/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: All KAP backend tests
        run: npm test
