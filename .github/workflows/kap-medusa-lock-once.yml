name: KAP Medusa - lock dependencies once

on:
  push:
    branches: [feature/kap-medusa-hybrid]
    paths:
      - '.github/workflows/kap-medusa-lock-once.yml'

permissions:
  contents: write

jobs:
  commit-lock:
    if: github.repository == 'RogerGrowSocial/GS-Ai-Website-Builder' && github.ref == 'refs/heads/feature/kap-medusa-hybrid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kap-medusa/apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate dependency lock without installing or executing packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only KAP Medusa lockfile on feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "KAP Medusa package lock is unchanged"
            exit 0
          fi
          git commit -m "Lock verified KAP Medusa dependencies for reproducible builds"
          git push origin HEAD:feature/kap-medusa-hybrid
